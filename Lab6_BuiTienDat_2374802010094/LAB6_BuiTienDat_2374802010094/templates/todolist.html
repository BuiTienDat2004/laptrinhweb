<!DOCTYPE html>
<html>
<head>
    <title>To-Do List</title>
</head>
<body>
    <h1>To-Do List</h1>

    <form method="POST">
        <input type="text" name="new_task" placeholder="New task..." required>
        <button type="submit">Add Task</button>
    </form>
  <ul>
    {% for task in tasks %}
        <li>
            <form method="POST" style="display:inline;">
                <input type="hidden" name="toggle" value="{{ loop.index0 }}">
                <button type="submit">
                    {% if task.completed %}
                        ✅
                    {% else %}
                        ⬜
                    {% endif %}
                </button>
            </form>
            <span style="text-decoration:  'line-through' if taskcompleted else 'none' ">
                {{ task.task }}
            </span>
        </li>
    {% else %}
        <li>No tasks yet.</li>
    {% endfor %}
</ul>
</body>
</html>
