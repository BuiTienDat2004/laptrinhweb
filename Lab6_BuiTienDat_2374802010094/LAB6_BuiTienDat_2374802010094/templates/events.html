<!DOCTYPE html>
<html>
<head>
    <title>Event List</title>
</head>
<body>
    <h1>Upcoming Events</h1>

    <form method="POST">
        <input type="text" name="name" placeholder="Event name" required>
        <input type="date" name="date" required>
        <button type="submit">Add Event</button>
    </form>

    <table border="1" cellpadding="8">
        <thead>
            <tr>
                <th>Event Name</th>
                <th>Date</th>
            </tr>
        </thead>
        <tbody>
            {% for event in events %}
                <tr>
                    <td>{{ event.name }}</td>
                    <td>{{ event.date }}</td>
                </tr>
            {% else %}
                <tr><td colspan="2">No events added yet.</td></tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
