<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
</head>
<body>
    <h1>Login Page</h1>
    <form method="POST">
        <label>Username:</label>
        <input type="text" name="username" required>
        <button type="submit">Login</button>
    </form>

    {% if username %}
        <h2>Welcome, {{ username }}!</h2>
    {% endif %}
</body>
</html>
